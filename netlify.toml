[build]
  command = "npm run build"
  publish = "dist/un-pas-apres-l-autre/browser"

[[plugins]]
  package = "@netlify/angular-runtime"

# Fully static site: prerendered pages are served as files first.
# Unknown URLs fall back to the client shell, which renders the 404 page.
[[redirects]]
  from = "/*"
  to = "/index.csr.html"
  status = 200
